name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Тесты ядра
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test

  desktop:
    name: Сборка десктоп-приложения
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - run: npm run typecheck
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      # Windows-пакет на Linux требует wine (NSIS-распаковщик uninstaller
      # запускается через него). На образе runner его нет — сборка падала
      # на каждом прогоне. Официальный образ electron-builder содержит wine
      # и нужные зависимости, поэтому сборка идёт внутри контейнера.
      - name: Сборка Windows-пакета
        run: |
          docker run --rm \
            -v "$PWD:/project" -w /project/desktop \
            electronuserland/builder:22-wine \
            npx electron-builder --win --x64 --config.win.target=nsis
      - uses: actions/upload-artifact@v4
        with:
          name: qlik-analyzer-windows
          path: desktop/release/*.exe
