# CI qlik-analyzer: проверка скриптов загрузки в merge request.
#
# Задача checkscript анализирует .qvs-файлы офлайн (ядро анализатора)
# и блокирует merge request при ошибках уровня error. Список файлов
# задаётся переменной QVS_FILES (пути через пробел) или все .qvs в репо.

stages:
  - check

checkscript:
  stage: check
  image: node:22
  script:
    - npm ci --omit=dev || npm install --omit=dev
    - |
      FILES="${QVS_FILES:-}"
      if [ -z "$FILES" ]; then
        FILES=$(git ls-files '*.qvs')
      fi
      if [ -z "$FILES" ]; then
        echo "В репозитории нет .qvs-файлов — проверять нечего."
        exit 0
      fi
      FAIL=0
      for f in $FILES; do
        echo "=== $f ==="
        npm run silent:checkscript -- "$f" || FAIL=1
      done
      exit $FAIL
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - "**/*.qvs"
